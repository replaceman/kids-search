<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>궁금해 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 음표 + 큰 검색창, 그 아래 노래 썸네일 격자. 재생 중엔 화면 아래 작은 플레이어 */
:root {
  --sky: #dff1fb;
  --sky-deep: #b9e0f4;
  --ink: #233a4a;
  --ink-soft: #557085;
  --sun: #ffc93c;
  --tomato: #ff6b4a;
  --leaf: #3fb37f;
  --card: #ffffff;
  --line: #cfe3ee;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #142636; --sky-deep: #1d3a52; --ink: #eaf4fb; --ink-soft: #a6c0d2;
    --sun: #ffd25e; --tomato: #ff8467; --leaf: #5fd29c; --card: #1c3247; --line: #2c4a63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #142636; --sky-deep: #1d3a52; --ink: #eaf4fb; --ink-soft: #a6c0d2;
  --sun: #ffd25e; --tomato: #ff8467; --leaf: #5fd29c; --card: #1c3247; --line: #2c4a63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6; min-height: 100vh;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 40px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px;
}
header { display: flex; justify-content: center; }
.logo { width: 92px; height: 92px; }

.bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 4px solid var(--ink);
  border-radius: 999px; padding: 8px 8px 8px 22px;
  box-shadow: 0 6px 0 var(--ink); transition: transform .15s;
}
.bar:focus-within { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
#q {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font-family: var(--font-display); font-size: 24px; color: var(--ink); padding: 8px 0;
}
#q::placeholder { color: var(--ink-soft); opacity: .7; }
#go {
  flex: none; border: 0; cursor: pointer; background: var(--sun); color: #233a4a;
  font-family: var(--font-display); font-size: 22px; padding: 12px 24px; border-radius: 999px;
}
#go:focus-visible { outline: 3px solid var(--tomato); outline-offset: 3px; }
.hint { margin: 12px 0 0; text-align: center; color: var(--ink-soft); font-size: 15px; }

.status { font-family: var(--font-display); font-size: 22px; margin: 0 0 12px; }
.empty { text-align: center; color: var(--ink-soft); margin: 0; }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.vid {
  background: var(--card); border: 2px solid var(--line); border-radius: 22px;
  padding: 10px; cursor: pointer; text-align: left; color: var(--ink);
  display: flex; flex-direction: column; gap: 8px; font: inherit;
  animation: pop .25s ease-out;
}
.vid:hover { border-color: var(--ink); }
.vid:focus-visible { outline: 3px solid var(--tomato); outline-offset: 3px; }
.vid.on { border-color: var(--tomato); box-shadow: 0 0 0 3px var(--tomato); }
.thumb {
  position: relative; aspect-ratio: 16/9; max-width: 100%; border-radius: 14px; overflow: hidden;
  background: var(--ph, var(--sky-deep)); display: grid; place-items: center;
}
.thumb .ph { position: absolute; font-family: var(--font-display); font-size: 44px; color: #233a4a; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.sm { width: 96px; flex: none; border-radius: 10px; }
.thumb.sm .ph { font-size: 24px; }
.thumb .play {
  position: absolute; width: 52px; height: 52px; border-radius: 50%;
  background: var(--sun); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.vid .vt { font-family: var(--font-display); font-size: 19px; line-height: 1.3; padding: 0 4px 4px; }
mark { background: var(--sun); color: #233a4a; border-radius: 4px; padding: 0 2px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 4px solid var(--ink);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-in { max-width: 760px; margin: 0 auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.player { width: 356px; max-width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; flex: none; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.dock-side { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 10px; }
.now { font-family: var(--font-display); font-size: 14px; color: var(--ink-soft); }
.now-title { font-family: var(--font-display); font-size: 22px; line-height: 1.25; }
.stop {
  align-self: flex-start; border: 0; cursor: pointer; background: var(--tomato); color: #fff;
  font-family: var(--font-display); font-size: 20px; padding: 10px 22px; border-radius: 999px;
}
.stop:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
body.playing .wrap { padding-bottom: 300px; }

.grown { border: 2px dashed var(--line); border-radius: 20px; padding: 14px 18px; }
.grown summary { cursor: pointer; font-family: var(--font-display); font-size: 18px; color: var(--ink-soft); }
.grown h4 { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 22px 0 0; }
.grown .note { margin: 4px 0 0; font-size: 14px; color: var(--ink-soft); }
.grown .note a { color: var(--tomato); }
.grown form { display: grid; gap: 10px; margin-top: 12px; }
.grown label { font-size: 14px; color: var(--ink-soft); display: grid; gap: 4px; }
.grown input {
  font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); min-width: 0;
}
.btn {
  justify-self: start; border: 0; cursor: pointer; background: var(--leaf); color: #fff;
  font-family: var(--font-display); font-size: 18px; padding: 8px 20px; border-radius: 999px;
}
.btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); font-size: 15px; padding: 4px 14px; }
.btn:disabled { opacity: .5; cursor: wait; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.range { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.msg { font-size: 14px; margin: 0; min-height: 1.4em; }
.msg.err { color: var(--tomato); }
.msg.ok { color: var(--leaf); }
.pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--sky); color: var(--ink-soft); }
.pill.on { background: var(--leaf); color: #fff; }
.saved { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.saved li { display: flex; gap: 12px; align-items: center; font-size: 15px; }
.saved li .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; }
.saved li .txt b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.saved small { color: var(--ink-soft); }
.del {
  flex: none; border: 2px solid var(--line); background: var(--card); color: var(--ink-soft);
  border-radius: 999px; padding: 4px 14px; cursor: pointer; font: inherit; font-size: 14px;
}
.del.sure { background: var(--tomato); border-color: var(--tomato); color: #fff; }
.del:focus-visible, .btn:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
@keyframes pop { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .vid { animation: none; } .bar { transition: none; } }
@media (max-width: 480px) {
  #q { font-size: 20px; }
  #go { padding: 10px 16px; font-size: 19px; }
  .vids { grid-template-columns: 1fr 1fr; gap: 10px; }
  .vid .vt { font-size: 16px; }
  .thumb .play { width: 40px; height: 40px; }
}
/* ---- 어른용: 유튜브 검색 결과와 구간 고르기 ---- */
.ysearch { display: flex; gap: 8px; margin-top: 12px; }
.ysearch input { flex: 1; }
.yres { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; max-height: 420px; overflow-y: auto; }
.yres li { display: flex; gap: 12px; align-items: center; }
.yres .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 15px; overflow-wrap: anywhere; }
.yres .txt b { font-weight: 400; font-family: var(--font-display); font-size: 16px; line-height: 1.3; }
.yres small, .ed small { color: var(--ink-soft); }
.pick {
  flex: none; border: 0; cursor: pointer; background: var(--sun); color: #233a4a;
  font-family: var(--font-display); font-size: 15px; padding: 6px 14px; border-radius: 999px;
}
.pick:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
.ed {
  margin-top: 14px; padding: 14px; border-radius: 18px; background: var(--card); border: 2px solid var(--line);
  display: grid; gap: 12px;
}
.edPlayer { width: 100%; max-width: 480px; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
.edPlayer iframe { width: 100%; height: 100%; border: 0; display: block; }
.times { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.times span:nth-child(2) { color: var(--ink-soft); font-size: 15px; align-self: center; }
.dual { position: relative; height: 44px; touch-action: none; }
.dual .track, .dual .fill { position: absolute; top: 18px; height: 8px; border-radius: 8px; }
.dual .track { left: 0; right: 0; background: var(--line); }
.dual .fill { background: var(--tomato); }
.dual input[type=range] {
  position: absolute; inset: 0; width: 100%; height: 44px; margin: 0; background: transparent;
  pointer-events: none; -webkit-appearance: none; appearance: none;
}
.dual input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 44px; }
.dual input[type=range]::-moz-range-track { background: transparent; height: 44px; }
.dual input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: auto; cursor: grab;
  width: 28px; height: 28px; margin-top: 8px; border-radius: 50%;
  background: var(--sun); border: 4px solid var(--ink);
}
.dual input[type=range]::-moz-range-thumb {
  pointer-events: auto; cursor: grab; width: 20px; height: 20px; border-radius: 50%;
  background: var(--sun); border: 4px solid var(--ink);
}
.dual input[type=range]:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--tomato); outline-offset: 2px; }
.dual input.endH::-webkit-slider-thumb { background: var(--tomato); }
.dual input.endH::-moz-range-thumb { background: var(--tomato); }
.or { margin: 16px 0 0; font-size: 14px; color: var(--ink-soft); }
.or summary { cursor: pointer; font-family: var(--font-body); font-size: 14px; }
.or .ysearch { margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 100 100" role="img" aria-label="궁금해 검색">
      <path d="M36 72 V22 L82 12 V62" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M36 22 L82 12 V26 L36 36 Z" fill="var(--ink)"/>
      <ellipse cx="25" cy="74" rx="14" ry="11" transform="rotate(-20 25 74)" fill="var(--sun)" stroke="var(--ink)" stroke-width="5"/>
      <ellipse cx="71" cy="64" rx="14" ry="11" transform="rotate(-20 71 64)" fill="var(--tomato)" stroke="var(--ink)" stroke-width="5"/>
    </svg>
  </header>

  <form id="f" role="search">
    <div class="bar">
      <input id="q" type="search" autocomplete="off" placeholder="노래 이름을 적어 봐" aria-label="노래 찾기">
      <button id="go" type="submit">찾기</button>
    </div>
    <p class="hint">글자 첫소리만 적어도 찾아줘요. ㄱㄹ → 고래</p>
  </form>

  <section aria-live="polite">
    <p class="status" id="status"></p>
    <div id="results"></div>
  </section>

  <details class="grown" id="grown">
    <summary>어른용 · 노래 넣기와 정리</summary>

    <p class="msg err" id="setupMsg" hidden></p>

    <form id="pinForm" novalidate hidden>
      <label for="pin">어른용 비밀번호
        <input id="pin" type="password" autocomplete="off">
      </label>
      <button class="btn" type="submit">확인</button>
      <p class="msg" id="pinMsg" aria-live="polite"></p>
    </form>

    <div id="tools">
      <h4>유튜브에서 찾아서 넣기</h4>
      <form class="ysearch" id="ysForm" novalidate>
        <input id="ys" type="search" autocomplete="off" placeholder="예: 핑크퐁 상어가족" aria-label="유튜브 검색어">
        <button class="btn" type="submit" id="ysBtn">검색</button>
      </form>
      <p class="msg" id="ysMsg" aria-live="polite"></p>
      <ul class="yres" id="yres"></ul>

      <details class="or">
        <summary>유튜브 주소로 바로 넣기</summary>
        <form class="ysearch" id="urlForm" novalidate>
          <input id="vUrl" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://youtu.be/..." aria-label="유튜브 주소">
          <button class="btn" type="submit">고르기</button>
        </form>
      </details>

      <div class="ed" id="ed" hidden>
        <div class="edPlayer"><div id="edPlayer"></div></div>
        <label for="vTitle">아이에게 보일 이름
          <input id="vTitle" type="text">
        </label>
        <label for="vKeys">찾을 때 쓸 낱말 (띄어쓰기로 구분, 비워도 돼요)
          <input id="vKeys" type="text" placeholder="예: 상어 바다 동요">
        </label>
        <div>
          <div class="times"><span id="tStart">0:00</span><span id="tLen"></span><span id="tEnd">0:00</span></div>
          <div class="dual" id="dual">
            <div class="track"></div><div class="fill" id="fill"></div>
            <input type="range" id="rStart" min="0" max="100" step="1" value="0" aria-label="시작 위치">
            <input type="range" id="rEnd" class="endH" min="0" max="100" step="1" value="100" aria-label="끝 위치">
          </div>
          <small>노랑 손잡이는 시작, 빨강 손잡이는 끝이에요. 끄는 동안 그 위치로 미리 넘어가요.</small>
        </div>
        <div class="row">
          <button class="btn ghost" type="button" id="hearRange">▶ 이 구간 들어보기</button>
          <button class="btn ghost" type="button" id="nowStart">지금 위치를 시작으로</button>
          <button class="btn ghost" type="button" id="nowEnd">지금 위치를 끝으로</button>
        </div>
        <div class="row">
          <button class="btn" type="button" id="addBtn">이 노래 넣기</button>
          <button class="btn ghost" type="button" id="edCancel">취소</button>
        </div>
        <p class="msg" id="addMsg" aria-live="polite"></p>
      </div>

      <div id="legacyBox" hidden>
        <h4>예전에 넣은 노래</h4>
        <p class="note" id="legacyNote"></p>
        <div class="row" style="margin-top:8px">
          <button class="btn" type="button" id="legacyMove">함께 쓰는 목록으로 옮기기</button>
        </div>
      </div>

      <h4>넣은 노래</h4>
      <p class="note">필요 없는 노래는 ‘빼기’를 두 번 누르면 지워져요.</p>
      <ul class="saved" id="saved"></ul>
      <p class="msg" id="savedMsg" aria-live="polite"></p>
    </div>
  </details>
</div>

<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="player" id="player"></div>
    <div class="dock-side">
      <span class="now">지금 듣는 중</span>
      <span class="now-title" id="nowTitle"></span>
      <button class="stop" id="stop" type="button">그만 듣기</button>
    </div>
  </div>
</div>

<script>
/* 구글 Apps Script 웹 앱 주소. 노래 목록 저장과 유튜브 검색을 맡아요 */
const SCRIPT_URL = "";

const PIN_KEY = "kids-search-pin";
const CACHE_KEY = "kids-search-cache";
const LEGACY_KEY = "kids-search-videos";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let pin = store.get(PIN_KEY) || "";
let SONGS = [];
try { SONGS = JSON.parse(store.get(CACHE_KEY) || "[]"); } catch (e) { SONGS = []; }
const $ = id => document.getElementById(id);

/* ---------- 서버 ---------- */
async function apiGet(params) {
  const r = await fetch(`${SCRIPT_URL}?${new URLSearchParams(params)}&t=${Date.now()}`);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "ERR");
  return j;
}
async function apiPost(body) {
  // text/plain 으로 보내야 Apps Script가 막지 않아요
  const r = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ ...body, pin }) });
  const j = await r.json();
  if (j.songs) setSongs(j.songs);
  if (!j.ok) throw new Error(j.error || "ERR");
  return j;
}
const errText = e => ({
  PIN: "비밀번호가 맞지 않아요. 다시 입력해 주세요.",
  DUP: "이미 넣은 노래예요(같은 구간).",
  BAD_ID: "유튜브 영상을 알아보지 못했어요.",
  NO_SERVER: "아직 서버가 연결되지 않았어요.",
}[e.message] || (/YouTube/.test(e.message)
  ? "유튜브 검색을 못 했어요. Apps Script에 ‘YouTube Data API v3’ 서비스가 추가됐는지 확인해 주세요."
  : "연결이 잠시 안 돼요. 인터넷을 확인하고 다시 눌러 주세요."));

function setSongs(list) {
  SONGS = Array.isArray(list) ? list : [];
  store.set(CACHE_KEY, JSON.stringify(SONGS));
  render(); renderSaved(); renderLegacy();
}
async function loadSongs() {
  if (SCRIPT_URL) {
    try { setSongs((await apiGet({})).songs); return; } catch (e) {}
  } else {
    try {
      const r = await fetch(`./songs.json?t=${Date.now()}`, { cache: "no-store" });
      if (r.ok) setSongs(await r.json());
    } catch (e) {}
  }
}

/* ---------- 검색 (아이 화면) ---------- */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const COLORS = ["#ffc93c","#8fd3f4","#ffb3a1","#a8e6c4","#ffd98a","#c3d8ff"];
const chosung = s => [...s].map(ch => {
  const c = ch.charCodeAt(0) - 0xAC00;
  return (c >= 0 && c < 11172) ? CHO[Math.floor(c / 588)] : ch;
}).join("");
const isAllCho = s => s.length > 0 && [...s].every(ch => CHO.includes(ch));
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const decode = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };
const vkey = v => v.key || `${v.id}-${v.start || 0}-${v.end || 0}`;

function searchSongs(raw) {
  const q = raw.trim().replace(/\s+/g, "");
  if (!q) return SONGS;
  return SONGS.map(v => {
    const t = v.title.replace(/\s/g, "");
    let s = 0;
    if (t.startsWith(q)) s = 3;
    else if (t.includes(q)) s = 2;
    else if (isAllCho(q) && chosung(t).includes(q)) s = 2;
    else if ((v.keys || "").replace(/\s/g, "").includes(q)) s = 1;
    return { v, s };
  }).filter(x => x.s).sort((a, b) => b.s - a.s).map(x => x.v);
}
function hl(text, q) {
  if (!q || isAllCho(q)) return esc(text);
  const i = text.indexOf(q);
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(q) + "</mark>" + esc(text.slice(i + q.length));
}

/* ---------- 시간 ---------- */
const fmt = n => {
  n = Math.max(0, Math.floor(n));
  const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s = n % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
};
const rangeText = v => (v.start || v.end) ? `${fmt(v.start || 0)} ~ ${v.end ? fmt(v.end) : "끝"}` : "";
function ytId(url) {
  try {
    let s = url.trim();
    const m = s.match(/(?:https?:\/\/)?[^\s]*(?:youtube|youtu\.be)[^\s]*/i);
    if (m) s = m[0];
    if (/^[\w-]{11}$/.test(s)) return s;
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;
    const u = new URL(s);
    const host = u.hostname.replace(/^www\.|^m\.|^music\./, "");
    let id = "";
    if (host === "youtu.be") id = u.pathname.slice(1);
    else if (host.endsWith("youtube.com") || host.endsWith("youtube-nocookie.com")) {
      id = u.searchParams.get("v") || (u.pathname.match(/\/(?:embed|shorts|live)\/([^/?]+)/) || [])[1] || "";
    }
    id = id.split(/[/?&]/)[0];
    return /^[\w-]{11}$/.test(id) ? id : "";
  } catch (e) { return ""; }
}

/* ---------- 아이 화면 재생 ---------- */
let playingId = "";
function play(v) {
  playingId = vkey(v);
  const rng = (v.start ? `&start=${v.start}` : "") + (v.end ? `&end=${v.end}` : "");
  $("player").innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&playsinline=1&rel=0${rng}"
    title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  $("nowTitle").textContent = v.title;
  $("dock").hidden = false;
  document.body.classList.add("playing");
  markPlaying();
}
function stop() {
  playingId = ""; $("player").innerHTML = ""; $("dock").hidden = true;
  document.body.classList.remove("playing"); markPlaying();
}
function markPlaying() {
  document.querySelectorAll(".vid").forEach(b => b.classList.toggle("on", b.dataset.id === playingId));
}
$("stop").addEventListener("click", stop);

const PLAY_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#233a4a"/></svg>`;
function thumb(v, cls = "", inner = "") {
  const n = [...v.id].reduce((a, c) => a + c.charCodeAt(0), 0);
  return `<span class="thumb ${cls}" style="--ph:${COLORS[n % COLORS.length]}">
    <span class="ph" aria-hidden="true">${esc([...v.title][0] || "♪")}</span>
    <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">
    ${inner}
  </span>`;
}
const $q = $("q");
function render() {
  const raw = $q.value;
  const q = raw.trim().replace(/\s+/g, "");
  const list = searchSongs(raw);
  if (!SONGS.length) {
    $("status").textContent = "";
    $("results").innerHTML = `<p class="empty">아직 노래가 없어요. 어른에게 노래를 넣어 달라고 해 보세요.</p>`;
    return;
  }
  if (!list.length) {
    $("status").textContent = "";
    $("results").innerHTML = `<p class="empty">‘${esc(raw.trim())}’ 노래는 아직 없어요.</p>`;
    return;
  }
  $("status").textContent = q ? `${list.length}곡을 찾았어요!` : "내 노래";
  $("results").innerHTML = `<div class="vids">${list.map(v => `
    <button type="button" class="vid" data-id="${esc(vkey(v))}">
      ${thumb(v, "", `<span class="play">${PLAY_ICON}</span>`)}
      <span class="vt">${hl(v.title, q)}</span>
    </button>`).join("")}</div>`;
  markPlaying();
}
$("results").addEventListener("click", e => {
  const b = e.target.closest(".vid"); if (!b) return;
  const v = SONGS.find(x => vkey(x) === b.dataset.id);
  if (v) playingId === vkey(v) ? stop() : play(v);
});
$("f").addEventListener("submit", e => { e.preventDefault(); render(); });
$q.addEventListener("input", render);

/* ---------- 어른용: 비밀번호 ---------- */
async function setupGrown() {
  if (!SCRIPT_URL) {
    $("setupMsg").hidden = false;
    $("setupMsg").textContent = "아직 노래를 저장할 서버(Apps Script)가 연결되지 않았어요. 지금은 볼 수만 있어요.";
    $("tools").hidden = true;
    return;
  }
  try {
    const j = await apiGet({ action: "check", pin });
    const need = j.needPin && !j.valid;
    $("pinForm").hidden = !need;
    $("tools").hidden = need;
  } catch (e) {
    $("setupMsg").hidden = false; $("setupMsg").textContent = errText(e);
  }
}
$("pinForm").addEventListener("submit", async e => {
  e.preventDefault();
  const val = $("pin").value;
  try {
    const j = await apiGet({ action: "check", pin: val });
    if (!j.valid) throw new Error("PIN");
    pin = val; store.set(PIN_KEY, pin);
    $("pinForm").hidden = true; $("tools").hidden = false;
  } catch (err) {
    $("pinMsg").className = "msg err"; $("pinMsg").textContent = errText(err);
  }
});

/* ---------- 어른용: 유튜브 검색 ---------- */
let found = [];
$("ysForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("ys").value.trim();
  const $m = $("ysMsg");
  $m.className = "msg";
  if (!q) { $m.classList.add("err"); $m.textContent = "찾을 노래 이름을 적어 주세요."; return; }
  $("ysBtn").disabled = true; $m.textContent = "찾는 중…"; $("yres").innerHTML = "";
  try {
    found = (await apiGet({ action: "search", q })).items.map(i => ({ ...i, title: decode(i.title), channel: decode(i.channel) }));
    $m.textContent = found.length ? "" : "검색 결과가 없어요. 다른 말로 찾아 주세요.";
    $("yres").innerHTML = found.map((v, i) => `<li>${thumb(v, "sm")}
      <span class="txt"><b>${esc(v.title)}</b><small>${esc(v.channel)}${v.duration ? " · " + fmt(v.duration) : ""}</small></span>
      <button type="button" class="pick" data-i="${i}">고르기</button></li>`).join("");
  } catch (err) {
    $m.classList.add("err"); $m.textContent = errText(err);
  } finally { $("ysBtn").disabled = false; }
});
$("yres").addEventListener("click", e => {
  const b = e.target.closest(".pick"); if (!b) return;
  openEditor(found[+b.dataset.i]);
});
$("urlForm").addEventListener("submit", e => {
  e.preventDefault();
  const id = ytId($("vUrl").value);
  if (!id) { $("ysMsg").className = "msg err"; $("ysMsg").textContent = "유튜브 영상 주소가 아니에요."; return; }
  openEditor({ id, title: "", duration: 0 });
});

/* ---------- 어른용: 미리 듣기 + 구간 끌어서 정하기 ---------- */
let ytReady = null, edPlayer = null, cur = null;
function loadYT() {
  if (!ytReady) ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  });
  return ytReady;
}
const rS = $("rStart"), rE = $("rEnd");
function setMax(d) {
  d = Math.max(1, Math.floor(d));
  rS.max = rE.max = d;
  if (+rE.value === 0 || +rE.value > d) rE.value = d;
  if (+rS.value >= +rE.value) rS.value = 0;
  paintRange();
}
function paintRange() {
  const max = +rS.max || 1, a = +rS.value, b = +rE.value;
  $("fill").style.left = (a / max * 100) + "%";
  $("fill").style.width = ((b - a) / max * 100) + "%";
  $("tStart").textContent = fmt(a);
  $("tEnd").textContent = fmt(b);
  $("tLen").textContent = `${fmt(b - a)} 동안`;
  // 겹쳤을 때 뒤에 있는 손잡이를 잡을 수 있게
  rS.style.zIndex = a > max - 2 ? 3 : 2;
}
function seek(t) { if (edPlayer && edPlayer.seekTo) edPlayer.seekTo(t, true); }
rS.addEventListener("input", () => { if (+rS.value > +rE.value - 1) rS.value = +rE.value - 1; paintRange(); seek(+rS.value); });
rE.addEventListener("input", () => { if (+rE.value < +rS.value + 1) rE.value = +rS.value + 1; paintRange(); seek(Math.max(+rS.value, +rE.value - 3)); });

async function openEditor(v) {
  cur = v;
  $("ed").hidden = false;
  $("vTitle").value = v.title || "";
  $("vKeys").value = "";
  $("addMsg").textContent = "";
  rS.max = rE.max = 100; rS.value = 0; rE.value = 0;
  setMax(v.duration || 100);
  $("ed").scrollIntoView({ behavior: "smooth", block: "start" });
  await loadYT();
  const onReady = () => {
    const d = edPlayer.getDuration && edPlayer.getDuration();
    if (d) { rE.value = 0; setMax(d); }
    if (!$("vTitle").value) {
      const t = edPlayer.getVideoData && edPlayer.getVideoData().title;
      if (t) $("vTitle").value = t;
    }
  };
  if (edPlayer) {
    edPlayer.cueVideoById(v.id);
    setTimeout(onReady, 1200);
  } else {
    edPlayer = new YT.Player("edPlayer", {
      host: "https://www.youtube-nocookie.com",
      videoId: v.id,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady,
        onStateChange: ev => { if (ev.data === YT.PlayerState.CUED || ev.data === YT.PlayerState.PLAYING) { const d = edPlayer.getDuration(); if (d && Math.floor(d) !== +rS.max) setMax(d); } },
      },
    });
  }
}
$("hearRange").addEventListener("click", () => {
  if (!edPlayer || !cur) return;
  edPlayer.loadVideoById({ videoId: cur.id, startSeconds: +rS.value, endSeconds: +rE.value });
});
$("nowStart").addEventListener("click", () => {
  if (!edPlayer) return;
  rS.value = Math.min(Math.floor(edPlayer.getCurrentTime()), +rE.value - 1); paintRange();
});
$("nowEnd").addEventListener("click", () => {
  if (!edPlayer) return;
  rE.value = Math.max(Math.ceil(edPlayer.getCurrentTime()), +rS.value + 1); paintRange();
});
$("edCancel").addEventListener("click", () => {
  if (edPlayer && edPlayer.stopVideo) edPlayer.stopVideo();
  $("ed").hidden = true; cur = null;
});
$("addBtn").addEventListener("click", async () => {
  if (!cur) return;
  const $m = $("addMsg");
  const max = +rS.max;
  const start = +rS.value;
  const end = +rE.value >= max - 1 ? 0 : +rE.value;   // 끝까지면 0으로 저장
  const title = $("vTitle").value.trim() || `내 노래 ${SONGS.length + 1}`;
  $("addBtn").disabled = true; $m.className = "msg"; $m.textContent = "넣는 중…";
  try {
    await apiPost({ action: "add", song: { id: cur.id, title, keys: $("vKeys").value.trim(), start, end } });
    if (edPlayer && edPlayer.stopVideo) edPlayer.stopVideo();
    $m.className = "msg ok"; $m.textContent = `‘${title}’을(를) 넣었어요. 다른 기기에서도 바로 보여요.`;
    setTimeout(() => { $("ed").hidden = true; cur = null; }, 1500);
  } catch (err) {
    $m.className = "msg err"; $m.textContent = errText(err);
  } finally { $("addBtn").disabled = false; }
});

/* ---------- 어른용: 넣은 노래 ---------- */
function renderSaved() {
  $("saved").innerHTML = SONGS.length
    ? SONGS.map(v => `<li>${thumb(v, "sm")}
        <span class="txt"><b>${esc(v.title)}</b><small>${esc([rangeText(v), v.keys].filter(Boolean).join(" · "))}</small></span>
        <button type="button" class="del" data-id="${esc(vkey(v))}">빼기</button></li>`).join("")
    : `<li><small>아직 넣은 노래가 없어요.</small></li>`;
}
$("saved").addEventListener("click", async e => {
  const b = e.target.closest(".del"); if (!b) return;
  if (!b.classList.contains("sure")) {
    $("saved").querySelectorAll(".del.sure").forEach(x => { x.classList.remove("sure"); x.textContent = "빼기"; });
    b.classList.add("sure"); b.textContent = "정말 빼기";
    setTimeout(() => { if (b.isConnected && b.classList.contains("sure")) { b.classList.remove("sure"); b.textContent = "빼기"; } }, 3000);
    return;
  }
  const k = b.dataset.id;
  b.disabled = true; b.textContent = "빼는 중…";
  try {
    if (playingId === k) stop();
    await apiPost({ action: "delete", key: k });
    $("savedMsg").textContent = "";
  } catch (err) {
    b.disabled = false; b.classList.remove("sure"); b.textContent = "빼기";
    $("savedMsg").className = "msg err"; $("savedMsg").textContent = errText(err);
  }
});

/* ---------- 예전 방식으로 넣은 노래 옮기기 ---------- */
let oldShared = [];
function legacyCandidates() {
  let local = [];
  try { local = JSON.parse(store.get(LEGACY_KEY) || "[]"); } catch (e) {}
  const all = [...local, ...oldShared];
  const seen = new Set(SONGS.map(vkey));
  return all.filter(v => { const k = vkey(v); if (seen.has(k)) return false; seen.add(k); return true; });
}
function renderLegacy() {
  if (!SCRIPT_URL) { $("legacyBox").hidden = true; return; }
  const c = legacyCandidates();
  $("legacyBox").hidden = !c.length;
  $("legacyNote").textContent = `예전 방식으로 넣어 둔 노래가 ${c.length}곡 있어요: ${c.map(v => v.title).join(", ")}`;
}
$("legacyMove").addEventListener("click", async e => {
  const c = legacyCandidates(); if (!c.length) return;
  e.target.disabled = true;
  try {
    await apiPost({ action: "addMany", songs: c.map(v => ({ id: v.id, title: v.title, keys: v.keys || "", start: v.start || 0, end: v.end || 0 })) });
    store.del(LEGACY_KEY); oldShared = [];
    renderLegacy();
  } catch (err) {
    $("legacyNote").textContent = errText(err);
  } finally { e.target.disabled = false; }
});

render(); renderSaved();
loadSongs();
setupGrown();
if (SCRIPT_URL) {
  // 토큰 방식 때 저장소 파일에 넣어 둔 노래도 옮길 수 있게
  fetch(`./songs.json?t=${Date.now()}`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : []).then(j => { oldShared = Array.isArray(j) ? j : []; renderLegacy(); }).catch(() => {});
}
</script>
</body>
